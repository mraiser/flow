[package]
name = "flowlang"
version = "0.3.43"
edition = "2021"
license = "MIT"
readme = "README.md"
description = "A dataflow oriented programming meta-language in JSON supporting functions written in rust, python, javascript, java, and flow."
homepage = "https://github.com/mraiser/flow"
documentation = "https://docs.rs/flowlang/latest/flowlang/"
repository = "https://github.com/mraiser/flow"
# Package allowlist (FACETS.md, packaging intentionality): what ships to
# crates.io is a decision, not a default. The crate carries its code and
# the flowlang library's own store data (the future read-only facet home)
# and nothing else - dev fixtures (data/mcp, data/testflow), local runtime
# settings (config.properties), and anything a checkout accumulates stay
# out by construction.
include = [
    "/src",
    "/data/flowlang",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE.md",
    "/FACETS.md",
]

[features]
serde_support = ["serde","serde_json","ndata/serde_support"]
java_runtime = ["jni"]
python_runtime = ["pyo3"]
javascript_runtime = ["deno_core","serde_support","tokio","ureq"]
mirror = []
python_no_singleton = []
gag = ["dep:gag"]

[dependencies]
ndata = { version = "0.3.17" }
libc = "0.2"

gag = { version = "1.0", optional = true }
jni = { version = "^0.21.1", features = ["invocation"], optional = true }
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }
deno_core = { version = "0.413", optional = true }
tokio = { version = "1", features = ["rt", "time", "sync"], optional = true }
# fetch's HTTP client, kept small: rustls + Mozilla's roots only (no gzip,
# no platform verifier). Interim: outbound HTTP(S) is to move into a
# newbound control with no third-party code.
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "flow"
path = "src/main.rs"

[[bin]]
name = "flowb"
path = "src/build.rs"

[[bin]]
name = "flowmcp"
path = "src/flowmcp.rs"
#required-features = ["gag"]
